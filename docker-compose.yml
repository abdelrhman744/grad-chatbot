      - ./backend/processed_files.json:/app/processed_files.json
    depends_on:
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      # The embedding + cross-encoder models load at FastAPI import time
      # (before uvicorn even binds the port), and on first run download
      # several GB from HuggingFace Hub — on a slow/unauthenticated
      # connection this can take well past a couple of minutes. A long
      # start_period avoids a slow first download flipping the container
      # to "unhealthy" (which would abort the frontend's depends_on).
      # Subsequent starts reuse the backend_model_cache volume and are fast.
      start_period: 10m
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Must be correct at BUILD time — next.config.js's rewrites() is
        # frozen into .next/routes-manifest.json by `next build` and never
        # re-evaluated at runtime, so setting this only in `environment:`
        # below would be too late. See frontend/Dockerfile.
        BACKEND_INTERNAL_URL: http://backend:8000
    image: doc-frontend
    container_name: doc-assistant-frontend
    restart: unless-stopped
    environment:
      # Kept for any runtime code that reads it directly; the rewrite
      # destination itself comes from the build ARG above, not this.
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  qdrant_data:
  minio_data:
  backend_model_cache:
